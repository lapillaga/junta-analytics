name: Claude Code Review

# Claude reviews a PR when it is opened, reopened or marked ready, and on a `/review` comment.
# A push does not trigger a review. Comment triggers run the workflow of the default branch.
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret; without it the job warns and passes.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  # Safe here: only repository members can trigger it and a step refuses a PR from a fork.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions:
  contents: read

jobs:
  claude-review:
    name: claude-review
    # One review per PR at a time; a new `/review` cancels the one in progress.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    timeout-minutes: 20
    # Dependabot PRs get no secrets, and CI already validates dependency bumps.
    if: >-
      github.actor != 'dependabot[bot]' && (
        (github.event_name == 'pull_request'
          && !github.event.pull_request.draft
          && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && contains(github.event.comment.body, '/review')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the summary and the inline comments
      issues: write # a PR comment is an issue comment
      id-token: write # the action exchanges an OIDC token for its app token
      actions: read # read the CI logs when a check failed

    steps:
      - name: Check Claude token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=CLAUDE_CODE_OAUTH_TOKEN is missing::Claude did not review this PR: the secret is not set in the repository or the organisation."
          fi

      # A comment event does not say where the PR head lives: ask the API and never review a fork.
      # github-script, because not every self-hosted runner has `gh`.
      - name: Check the PR head repository
        id: head
        if: steps.token.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.payload.issue.number
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number })
            const sameRepo = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            core.setOutput('same_repo', String(sameRepo))
            if (!sameRepo) {
              core.warning('Claude does not review a PR whose head is in another repository.', { title: 'PR from a fork' })
            }

      - name: Checkout repository
        if: steps.head.outputs.same_repo == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The action fetches the PR head itself, so it needs the checkout credentials.
          persist-credentials: true

      # A comment event runs on the default branch: bring the PR head by its number.
      - name: Checkout the PR head (comment trigger)
        if: github.event_name == 'issue_comment' && steps.head.outputs.same_repo == 'true'
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git fetch origin "refs/pull/${PR_NUMBER}/head:pr-${PR_NUMBER}"
          git checkout "pr-${PR_NUMBER}"

      - name: Run Claude Code Review
        if: steps.head.outputs.same_repo == 'true'
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            IMPORTANT: write the WHOLE review in neutral Spanish, addressing the reader as "usted". Code and technical names stay in English.

            Review this pull request against the project standards: README.md and REVIEW.md.

            REVIEW.md is the checklist. Go through every item under "Always check", report as blocking what it lists under "Important", respect its limit for nits and ignore the files under "Skip".

            Also look for:
            - Bugs and logic errors against what the PR says it does.
            - Notebooks: no credentials, connection strings, personal data or real customer records in cells or in saved outputs; notebooks run top to bottom in the order the README lists.
            - Data and models: none of the files `.gitignore` excludes (`data/raw/*.csv`, `data/processed/*.csv`, `data/processed/*.pkl`, `data/models/*.pkl`, `data/models/*.joblib`) are committed, and connection settings come from `.env`, never from code.
            - Python code follows `black` and `flake8` (the README names both).
            - Wording of new or changed user-facing Spanish text (redundancy, agreement, accents, filler). Report it as an observation, not as blocking.
            - Commits: a short English subject.

            If CI failed, read the logs and say what went wrong.

            Start the summary with one line: "Veredicto: aprobado" when no finding is blocking, or "Veredicto: con hallazgos bloqueantes" otherwise.

            The PR branch is already checked out in the current directory.

            Use `gh pr comment` for the overall summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to point at specific problems in the code.
            Only post comments on GitHub; do not send review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
